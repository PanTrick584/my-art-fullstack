name: Deploy do mikr.us

on:
  push:
    branches: [ master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kodu
        uses: actions/checkout@v4

      - name: Ustaw PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Zainstaluj zależności PHP
        run: composer install --no-dev --optimize-autoloader --prefer-dist

      - name: Ustaw Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Zainstaluj zależności frontendu
        working-directory: frontend
        run: npm ci

      - name: Zbuduj frontend
        working-directory: frontend
        run: npm run build

      - name: Załaduj klucz SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Dodaj serwer do known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Wdróż przez rsync
        run: |
          rsync -avz --delete -e "ssh -p ${{ secrets.SSH_PORT }}" \
            --exclude='.git' --exclude='.github' --exclude='.env' \
            --exclude='frontend/node_modules' --exclude='notes-private' \
            ./ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/var/www/html/

      - name: Uruchom migracje na serwerze
        run: |
          ssh -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "cd /var/www/html && sudo docker compose -f docker-compose.prod.yml exec -T php php database/migrate.php"