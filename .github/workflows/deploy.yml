name: Deploy do mikr.us

on:
  push:
    branches: [ master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kodu
        uses: actions/checkout@v4

      - name: Załaduj klucz SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Dodaj serwer do known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ secrets.SSH_PORT }} $${{ secrets.SSH_HOST }} >> ~/.ssh/knowk_hosts

      - name: Wdróż przez rsync
        run: |
          rsync -avz --delete -e "ssh -p ${{ secrets.SSH_POST }}" \
          --exclude='.git' --exclude='.github' \
          ./ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:var/www/html/